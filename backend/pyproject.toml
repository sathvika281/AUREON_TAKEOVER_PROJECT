[project]
name = "aureon"
version = "0.1.0"
description = "Aureon Career Intelligence Platform - backend service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.21",
    "groq>=0.13",
    "supabase>=2.10",
    "structlog>=24.4",
    "httpx>=0.27",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aureon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
