services:
  - type: web
    name: aureon-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: uvicorn aureon.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: MIN_RECOMMENDATION_CONFIDENCE
        value: "0.6"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      # Secrets and deploy-specific values — filled in via the Render
      # dashboard when this blueprint is applied, never committed.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
