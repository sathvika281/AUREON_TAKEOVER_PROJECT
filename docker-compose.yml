services:
  backend:
    image: python:3.11-slim
    working_dir: /app
    command: sh -c "pip install -e . && uvicorn aureon.main:app --host 0.0.0.0 --reload"
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
