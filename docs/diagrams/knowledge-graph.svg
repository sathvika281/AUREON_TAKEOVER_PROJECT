<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 820" font-family="-apple-system, 'Segoe UI', Arial, sans-serif">
  <rect width="1300" height="820" fill="#070B18"/>
  <text x="60" y="50" fill="#F2EDE0" font-size="24" font-weight="600">Knowledge Graph</text>
  <text x="60" y="76" fill="#F2EDE0" fill-opacity="0.6" font-size="14">Real, id-based edges confirmed in the domain models — not every entity touches every other one.</text>

  <!-- Student (center) -->
  <circle cx="650" cy="410" r="72" fill="#0A0817" stroke="#8B8FD9" stroke-width="2.5"/>
  <text x="650" y="404" fill="#F2EDE0" font-size="15" font-weight="700" text-anchor="middle">Student</text>
  <text x="650" y="424" fill="#AEB2E8" font-size="10" text-anchor="middle">StudentProfile</text>

  <!-- Career -->
  <circle cx="650" cy="180" r="60" fill="#0A0817" stroke="#3A3560" stroke-width="1.5"/>
  <text x="650" y="184" fill="#F2EDE0" font-size="14" font-weight="600" text-anchor="middle">Career</text>

  <!-- Skill -->
  <circle cx="330" cy="300" r="56" fill="#0A0817" stroke="#3A3560" stroke-width="1.5"/>
  <text x="330" y="304" fill="#F2EDE0" font-size="14" font-weight="600" text-anchor="middle">Skill</text>

  <!-- Company -->
  <circle cx="960" cy="300" r="56" fill="#0A0817" stroke="#3A3560" stroke-width="1.5"/>
  <text x="960" y="304" fill="#F2EDE0" font-size="14" font-weight="600" text-anchor="middle">Company</text>

  <!-- Project -->
  <circle cx="330" cy="540" r="56" fill="#0A0817" stroke="#3A3560" stroke-width="1.5"/>
  <text x="330" y="544" fill="#F2EDE0" font-size="14" font-weight="600" text-anchor="middle">Project</text>

  <!-- Evidence -->
  <circle cx="650" cy="620" r="60" fill="#0A0817" stroke="#D9B87A" stroke-width="2"/>
  <text x="650" y="616" fill="#E9C98F" font-size="14" font-weight="600" text-anchor="middle">Evidence</text>
  <text x="650" y="634" fill="#E9C98F" font-size="10" text-anchor="middle">Graph</text>

  <!-- Mentor / Expert -->
  <circle cx="960" cy="540" r="56" fill="#0A0817" stroke="#3A3560" stroke-width="1.5"/>
  <text x="960" y="536" fill="#F2EDE0" font-size="13" font-weight="600" text-anchor="middle">Mentor</text>
  <text x="960" y="552" fill="#F2EDE0" fill-opacity="0.6" font-size="10" text-anchor="middle">(Expert)</text>

  <!-- Institution -->
  <circle cx="950" cy="700" r="52" fill="#0A0817" stroke="#3A3560" stroke-width="1.5"/>
  <text x="950" y="704" fill="#F2EDE0" font-size="13" font-weight="600" text-anchor="middle">Institution</text>

  <!-- Story -->
  <circle cx="330" cy="700" r="52" fill="#0A0817" stroke="#3A3560" stroke-width="1.5"/>
  <text x="330" y="696" fill="#F2EDE0" font-size="13" font-weight="600" text-anchor="middle">Career</text>
  <text x="330" y="712" fill="#F2EDE0" font-size="13" font-weight="600" text-anchor="middle">Story</text>

  <!-- Trend -->
  <circle cx="150" cy="150" r="46" fill="#0A0817" stroke="#3A3560" stroke-width="1.5"/>
  <text x="150" y="154" fill="#F2EDE0" font-size="12" font-weight="600" text-anchor="middle">Trend</text>

  <!-- Knowledge Circle -->
  <circle cx="1130" cy="150" r="50" fill="#0A0817" stroke="#3A3560" stroke-width="1.5"/>
  <text x="1130" y="146" fill="#F2EDE0" font-size="12" font-weight="600" text-anchor="middle">Knowledge</text>
  <text x="1130" y="162" fill="#F2EDE0" font-size="12" font-weight="600" text-anchor="middle">Circle</text>

  <!-- Opportunity (deliberately isolated - see below) -->
  <circle cx="1150" cy="620" r="52" fill="#0A0817" stroke="#3A3560" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="1150" y="624" fill="#F2EDE0" fill-opacity="0.7" font-size="13" font-weight="600" text-anchor="middle">Opportunity</text>

  <!-- Edges -->
  <g stroke="#8B8FD9" stroke-width="1.5" fill="none">
    <line x1="650" y1="240" x2="650" y2="338"/>
    <line x1="386" y1="330" x2="600" y2="390"/>
    <line x1="904" y1="330" x2="700" y2="390"/>
    <line x1="650" y1="482" x2="650" y2="560"/>
    <line x1="710" y1="450" x2="904" y2="510"/>
  </g>
  <g stroke="#3A3560" stroke-width="1.5" fill="none">
    <line x1="386" y1="290" x2="694" y2="200"/>  <!-- Career-Skill -->
    <line x1="904" y1="290" x2="710" y2="200"/>  <!-- Career-Company -->
    <line x1="330" y1="356" x2="330" y2="484"/>  <!-- Skill-Project -->
    <line x1="382" y1="512" x2="612" y2="215"/>  <!-- Project-Career -->
    <line x1="330" y1="596" x2="330" y2="648"/>  <!-- Project-Story (evidence-adjacent, dashed below) -->
    <line x1="650" y1="240" x2="330" y2="668"/>  <!-- Career-Story -->
    <line x1="694" y1="150" x2="196" y2="155"/>  <!-- Career-Trend -->
    <line x1="710" y1="155" x2="1080" y2="155"/> <!-- Career-KnowledgeCircle (via topic resources) -->
    <line x1="900" y1="565" x2="710" y2="215"/>  <!-- Mentor-Career -->
  </g>

  <!-- edge labels -->
  <g fill="#F2EDE0" fill-opacity="0.55" font-size="10.5">
    <text x="656" y="290">career_candidates</text>
    <text x="440" y="345">evidence_graph.related_skill</text>
    <text x="800" y="345" text-anchor="end">evidence_graph.related_career</text>
    <text x="656" y="520">student.project_attempts</text>
    <text x="770" y="480">mentorship request/match</text>

    <text x="490" y="200">required_skill_ids</text>
    <text x="795" y="200" text-anchor="end">company_ids</text>
    <text x="290" y="425">target_skill_ids</text>
    <text x="470" y="335">related_career_ids</text>
    <text x="330" y="622" text-anchor="middle">reverse lookup</text>
    <text x="470" y="480">career_stories</text>
    <text x="360" y="145">industry/trend context</text>
    <text x="850" y="145">topic_resource_domains</text>
    <text x="850" y="365">mentor.career_ids</text>
  </g>

  <!-- Opportunity note -->
  <line x1="1100" y1="600" x2="1000" y2="555" stroke="#3A3560" stroke-width="1" stroke-dasharray="2 3"/>
  <text x="1005" y="672" fill="#F2EDE0" fill-opacity="0.4" font-size="11" text-anchor="middle" style="max-width:200px">
  </text>
  <text x="1000" y="678" fill="#F2EDE0" fill-opacity="0.45" font-size="10.5">min_academic_level only —</text>
  <text x="1000" y="692" fill="#F2EDE0" fill-opacity="0.45" font-size="10.5">required_skills stays free text,</text>
  <text x="1000" y="706" fill="#F2EDE0" fill-opacity="0.45" font-size="10.5">not linked to the Skill catalog</text>
  <text x="1000" y="720" fill="#F2EDE0" fill-opacity="0.45" font-size="10.5">(documented gap, see debt register)</text>

  <!-- Institution note -->
  <text x="850" y="775" fill="#F2EDE0" fill-opacity="0.45" font-size="10.5">matched via Career DNA trait-tag alignment, not a direct Career edge</text>
  <line x1="900" y1="740" x2="700" y2="440" stroke="#3A3560" stroke-width="1" stroke-dasharray="2 3"/>

  <text x="60" y="788" fill="#F2EDE0" fill-opacity="0.32" font-size="11">Solid accent = student-scoped runtime edges. Thin lines = catalog-to-catalog edges (jsonb id arrays, no DB-level FK — see Technical Debt Register #1).</text>
</svg>
