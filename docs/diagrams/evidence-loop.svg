<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 520" font-family="-apple-system, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B8FD9"/>
    </marker>
  </defs>
  <rect width="1300" height="520" fill="#070B18"/>
  <text x="60" y="50" fill="#F2EDE0" font-size="24" font-weight="600">The Evidence Loop</text>
  <text x="60" y="76" fill="#F2EDE0" fill-opacity="0.6" font-size="14">domain/services/project.py::complete_project_attempt() — the genuine-engagement gate holds both ways, live-verified.</text>

  <!-- Step 1: Career exploration -->
  <rect x="60" y="140" width="180" height="90" rx="12" fill="#0A0817" stroke="#3A3560" stroke-width="1.5"/>
  <text x="150" y="178" fill="#F2EDE0" font-size="13" font-weight="600" text-anchor="middle">Career exploration</text>
  <text x="150" y="200" fill="#F2EDE0" fill-opacity="0.6" font-size="11" text-anchor="middle">Career Explorer /</text>
  <text x="150" y="216" fill="#F2EDE0" fill-opacity="0.6" font-size="11" text-anchor="middle">Knowledge Base</text>

  <line x1="240" y1="185" x2="288" y2="185" stroke="#8B8FD9" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Step 2: Project -->
  <rect x="290" y="140" width="180" height="90" rx="12" fill="#0A0817" stroke="#3A3560" stroke-width="1.5"/>
  <text x="380" y="178" fill="#F2EDE0" font-size="13" font-weight="600" text-anchor="middle">Project</text>
  <text x="380" y="200" fill="#F2EDE0" fill-opacity="0.6" font-size="11" text-anchor="middle">a real, attemptable brief</text>
  <text x="380" y="216" fill="#F2EDE0" fill-opacity="0.6" font-size="11" text-anchor="middle">(target_skill_ids)</text>

  <line x1="470" y1="185" x2="518" y2="185" stroke="#8B8FD9" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Step 3: Attempt -->
  <rect x="520" y="140" width="180" height="90" rx="12" fill="#0A0817" stroke="#3A3560" stroke-width="1.5"/>
  <text x="610" y="178" fill="#F2EDE0" font-size="13" font-weight="600" text-anchor="middle">Attempt submitted</text>
  <text x="610" y="200" fill="#F2EDE0" fill-opacity="0.6" font-size="11" text-anchor="middle">artifact_url + reflection</text>
  <text x="610" y="216" fill="#F2EDE0" fill-opacity="0.6" font-size="11" text-anchor="middle">honestly recorded either way</text>

  <line x1="700" y1="185" x2="748" y2="185" stroke="#8B8FD9" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Gate diamond -->
  <polygon points="850,140 970,185 850,230 730,185" fill="#0A0817" stroke="#D9B87A" stroke-width="2"/>
  <text x="850" y="180" fill="#E9C98F" font-size="12" font-weight="600" text-anchor="middle">Genuine</text>
  <text x="850" y="196" fill="#E9C98F" font-size="12" font-weight="600" text-anchor="middle">engagement?</text>

  <!-- Yes branch -->
  <line x1="970" y1="185" x2="1018" y2="185" stroke="#3D6B54" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="994" y="170" fill="#7FB096" font-size="11" text-anchor="middle">yes</text>

  <rect x="1020" y="140" width="200" height="90" rx="12" fill="#0A0817" stroke="#3D6B54" stroke-width="2"/>
  <text x="1120" y="172" fill="#F2EDE0" font-size="13" font-weight="600" text-anchor="middle">Evidence written</text>
  <text x="1120" y="194" fill="#F2EDE0" fill-opacity="0.6" font-size="11" text-anchor="middle">EvidenceRecord(source="project",</text>
  <text x="1120" y="210" fill="#F2EDE0" fill-opacity="0.6" font-size="11" text-anchor="middle">related_skill=X) — one per skill</text>

  <!-- No branch -->
  <line x1="850" y1="230" x2="850" y2="330" stroke="#C47A63" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="880" y="290" fill="#C47A63" font-size="11">no (empty submission)</text>

  <rect x="740" y="332" width="220" height="80" rx="12" fill="#0A0817" stroke="#C47A63" stroke-width="1.5"/>
  <text x="850" y="362" fill="#F2EDE0" font-size="13" font-weight="600" text-anchor="middle">Attempt recorded,</text>
  <text x="850" y="382" fill="#F2EDE0" font-size="13" font-weight="600" text-anchor="middle">zero evidence written</text>
  <text x="850" y="402" fill="#F2EDE0" fill-opacity="0.5" font-size="10.5" text-anchor="middle">completion alone ≠ a capability claim</text>

  <!-- Evidence flows down into skill/career signal -->
  <line x1="1120" y1="230" x2="1120" y2="330" stroke="#8B8FD9" stroke-width="2" marker-end="url(#arrow3)"/>
  <rect x="1010" y="332" width="220" height="80" rx="12" fill="#0A0817" stroke="#8B8FD9" stroke-width="1.5"/>
  <text x="1120" y="362" fill="#F2EDE0" font-size="13" font-weight="600" text-anchor="middle">Skill / Career signal</text>
  <text x="1120" y="384" fill="#F2EDE0" fill-opacity="0.6" font-size="11" text-anchor="middle">feeds Evidence Graph — read by</text>
  <text x="1120" y="400" fill="#F2EDE0" fill-opacity="0.6" font-size="11" text-anchor="middle">Career Explorer, Decision Lab</text>

  <!-- Loop back -->
  <path d="M 1010 372 C 500 460, 200 460, 150 232" fill="none" stroke="#3A3560" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow3)"/>
  <text x="500" y="480" fill="#F2EDE0" fill-opacity="0.4" font-size="12" text-anchor="middle">Future decision/exploration — the next Career Explorer or Decision Lab visit reads this same Evidence Graph.</text>

  <text x="60" y="500" fill="#F2EDE0" fill-opacity="0.32" font-size="11">Source: domain/services/project.py, domain/models/evidence.py — no automated evaluation of attempt quality; the gate checks for real content, not correctness.</text>
</svg>
